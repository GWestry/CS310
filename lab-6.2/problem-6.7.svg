<text x="70" y="210" class="small">FRONT</text>
<text x="70" y="234" class="small">linked nodes</text>
<text x="40" y="125" class="node">OPERATION: remove through the copied queue to index count/2.</text>
<line x1="40" y1="360" x2="1160" y2="360" stroke="#000000" stroke-width="2"/>
<rect x="40" y="390" width="540" height="120" fill="#ffffff" stroke="#000000" stroke-width="3"/>
<text x="58" y="422" class="section">BEFORE</text>
<text x="58" y="452" class="small">queue 1-&gt;2-&gt;3, copied without changing original.</text>

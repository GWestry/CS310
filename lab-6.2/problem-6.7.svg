<text x="170" y="293" class="node">1</text>
<circle cx="275" cy="284" r="7" fill="#000000"/>
<line x1="300" y1="284" x2="355" y2="284" stroke="#000000" stroke-width="3"/>
<polygon points="355,284 343,277 343,291" fill="#000000"/>
<rect x="320" y="250" width="150" height="68" fill="#ffffff" stroke="#000000" stroke-width="3"/>
<line x1="420" y1="250" x2="420" y2="318" stroke="#000000" stroke-width="2"/>
<text x="340" y="293" class="node">2</text>
<circle cx="445" cy="284" r="7" fill="#000000"/>
<line x1="470" y1="284" x2="525" y2="284" stroke="#000000" stroke-width="3"/>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<style>.title{font:700 30px Arial;fill:#000}.function{font:700 22px Arial;fill:#000}.body{font:20px Consolas,monospace;fill:#000}.node{font:700 20px Arial;fill:#000}.small{font:16px Arial;fill:#000}.section{font:700 18px Arial;fill:#000}</style>
<rect width="1200" height="700" fill="#ffffff"/>
<text x="40" y="45" class="title">Lab 6.2 - Problem 5.5</text>
<text x="40" y="80" class="function">Function: Fixed-Size LRU Cache</text>
<line x1="40" y1="105" x2="1160" y2="105" stroke="#000000" stroke-width="3"/>
<rect x="170" y="250" width="100" height="64" fill="#ffffff" stroke="#000000" stroke-width="3"/>
<text x="204.0" y="288" class="body">2</text>
<text x="212.0" y="338" class="small">[0]</text>
<rect x="270" y="250" width="100" height="64" fill="#ffffff" stroke="#000000" stroke-width="3"/>
<text x="304.0" y="288" class="body">1</text>
<text x="312.0" y="338" class="small">[1]</text>
<rect x="370" y="250" width="100" height="64" fill="#ffffff" stroke="#000000" stroke-width="3"/>
<text x="404.0" y="288" class="body">10</text>
<text x="412.0" y="338" class="small">[2]</text>
<rect x="470" y="250" width="100" height="64" fill="#ffffff" stroke="#000000" stroke-width="3"/>
<text x="504.0" y="288" class="body">2</text>
<text x="512.0" y="338" class="small">[3]</text>
<rect x="570" y="250" width="100" height="64" fill="#ffffff" stroke="#000000" stroke-width="3"/>
<text x="604.0" y="288" class="body">20</text>
<text x="612.0" y="338" class="small">[4]</text>
<text x="170" y="220" class="small">CIRCULAR ARRAY: front -&gt; index 0</text>
<text x="170" y="244" class="small">rear -&gt; next empty/wrapped index</text>
<text x="40" y="125" class="node">OPERATION: get(1), move accessed pair to front.</text>
<line x1="40" y1="360" x2="1160" y2="360" stroke="#000000" stroke-width="2"/>
<rect x="40" y="390" width="540" height="120" fill="#ffffff" stroke="#000000" stroke-width="3"/>
<text x="58" y="422" class="section">BEFORE</text>
<text x="58" y="452" class="small">LRU capacity=2, front order [1:10,2:20].</text>
<rect x="620" y="390" width="540" height="120" fill="#ffffff" stroke="#000000" stroke-width="3"/>
<text x="638" y="422" class="section">OUTPUT</text>
<text x="638" y="452" class="small">order [1:10,2:20], result=10.</text>
<rect x="40" y="530" width="540" height="120" fill="#ffffff" stroke="#000000" stroke-width="3"/>
<text x="58" y="562" class="section">BIG-O ANALYSIS</text>
<text x="58" y="592" class="small">O(capacity)/O(capacity).</text>
<rect x="620" y="530" width="540" height="120" fill="#ffffff" stroke="#000000" stroke-width="3"/>
<text x="638" y="562" class="section">EDGE CASES</text>
<text x="638" y="592" class="small">miss returns -1; capacity is clamped to [1,MAX].</text>

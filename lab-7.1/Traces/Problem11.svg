<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360"><text x="20" y="30" font-size="22">Problem 11 - flatten multilevel list</text><text x="20" y="70">Heap: 1 child-&gt;3, next-&gt;2</text><text x="20" y="120">Stack: flatten(1) | flatten(child 3) | return | flatten(next 2)</text><text x="20" y="170">Child is visited before next sibling</text><text x="20" y="230">Result: 1,3,2</text></svg>

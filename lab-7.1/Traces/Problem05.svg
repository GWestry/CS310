<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360"><text x="20" y="30" font-size="22">Problem 05 - remove duplicates</text><text x="20" y="70">Heap: 1 -&gt; 2 -&gt; 1 -&gt; 3 -&gt; 2</text><text x="20" y="120">Stack: dedupe(1) | scan(2) | scan(1) | dedupe(2)</text><text x="20" y="170">Duplicate nodes are unlinked and deleted</text><text x="20" y="230">Result: 1 -&gt; 2 -&gt; 3</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360"><text x="20" y="30" font-size="22">Problem 01 - reverse list</text><text x="20" y="70">Heap: 1 -&gt; 2 -&gt; 3 -&gt; 4 -&gt; NULL</text><text x="20" y="120">Stack: reverse(1) | reverse(2) | reverse(3) | reverse(4)</text><text x="20" y="170">Unwind: 4&lt;-3&lt;-2&lt;-1, then 1.next = NULL</text><text x="20" y="230">Final heap: 4 -&gt; 3 -&gt; 2 -&gt; 1 -&gt; NULL</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360"><text x="20" y="30" font-size="22">Problem 04 - merge sorted lists</text><text x="20" y="70">Heap: A=1-&gt;3, B=2-&gt;4</text><text x="20" y="120">Stack: merge(1,2) | merge(3,2) | merge(3,4) | base</text><text x="20" y="170">Choices unwind in sorted order</text><text x="20" y="230">Result: 1 -&gt; 2 -&gt; 3 -&gt; 4</text></svg>

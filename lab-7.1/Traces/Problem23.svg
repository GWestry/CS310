<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360"><text x="20" y="30" font-size="22">Problem 23 - recursive enqueue</text><text x="20" y="70">Input: 1,2,3,4</text><text x="20" y="120">Stack: enqueue(1) | enqueue(2) | enqueue(3) | enqueue(4)</text><text x="20" y="170">Base case is reached after all values are queued</text><text x="20" y="230">Result: 1,2,3,4</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360"><text x="20" y="30" font-size="22">Problem 06 - partition</text><text x="20" y="70">Heap: 3 -&gt; 5 -&gt; 1 -&gt; 4 -&gt; 2, pivot 3</text><text x="20" y="120">Stack: partition(3) | partition(5) | partition(1) | partition(4)</text><text x="20" y="170">Each node moves to low or high list</text><text x="20" y="230">Result: low 1,2 | high 3,5,4</text></svg>

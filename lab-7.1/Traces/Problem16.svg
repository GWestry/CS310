<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360"><text x="20" y="30" font-size="22">Problem 16 - split circular list</text><text x="20" y="70">Heap: 1 -&gt; 2 -&gt; 3 -&gt; 4 -&gt; 1</text><text x="20" y="120">Stack: split(head,4) | find midpoint | close both rings</text><text x="20" y="170">Two independent circular heads are produced</text><text x="20" y="230">Result: 1,2 and 3,4</text></svg>

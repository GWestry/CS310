<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360"><text x="20" y="30" font-size="22">Problem 28 - linked merge sort</text><text x="20" y="70">Heap: 4 -&gt; 1 -&gt; 3 -&gt; 2</text><text x="20" y="120">Stack: sort(4) | sort(1) | merge(4,1) | merge(3,2)</text><text x="20" y="170">Halves are merged in sorted order</text><text x="20" y="230">Result: 1 -&gt; 2 -&gt; 3 -&gt; 4</text></svg>

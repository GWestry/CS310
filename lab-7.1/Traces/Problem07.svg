<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360"><text x="20" y="30" font-size="22">Problem 07 - reverse doubly list</text><text x="20" y="70">Heap: 1 &lt;-&gt; 2 &lt;-&gt; 3 &lt;-&gt; 4</text><text x="20" y="120">Stack: reverse(1) | reverse(2) | reverse(3) | reverse(4)</text><text x="20" y="170">Swap next and prev during unwind</text><text x="20" y="230">Result: 4 &lt;-&gt; 3 &lt;-&gt; 2 &lt;-&gt; 1</text></svg>
